name: CPM Rust Windows and Linux

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish version after both platform builds pass
        type: boolean
        default: false
  push:
    tags:
      - 'rust-v*'

permissions:
  contents: read

concurrency:
  group: cpm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check release version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'cpm-app').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "rust-v$version") {
            throw "Le tag doit correspondre a la version Cargo : rust-v$version"
          }
          "CPM_VERSION=$version" >> $env:GITHUB_ENV
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release --workspace
      - name: Build Windows executable
        run: cargo build --locked -p cpm-app --release
      - name: Prepare portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item target/release/cpm.exe release/cpm-windows-x86_64.exe
      - name: Export bundled DynamX and BasicsAddon catalogues
        run: cargo run --locked --release -p cpm-core --example export_catalogs -- release/properties
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup est introuvable sur le runner" }
          & $compiler "/DAppVersion=$env:CPM_VERSION" installer/cpm.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilation de l'installateur echouee" }
      - name: Smoke test installer
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'cpm-install-test'
          $installer = (Resolve-Path release/cpm-setup-windows-x86_64.exe).Path
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$destination`"" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$destination\cpm.exe")) { throw "Installation de test echouee" }
          if ((Get-FileHash "$destination\cpm.exe").Hash -ne (Get-FileHash target/release/cpm.exe).Hash) { throw "Executable installe different du build" }
          if (-not (Test-Path "$destination\properties\dynamx.json") -or -not (Test-Path "$destination\properties\basics-addon.json")) { throw "Catalogues installes manquants" }
          $uninstaller = Join-Path $destination 'unins000.exe'
          $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$destination\cpm.exe")) { throw "Desinstallation de test echouee" }
      - uses: actions/upload-artifact@v7
        with:
          name: cpm-windows-x86_64
          path: release/cpm-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    env:
      RUSTUP_TOOLCHAIN: stable
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check release version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="cpm-app"))')
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "rust-v$version"; fi
          echo "CPM_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --release --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release --workspace
      - name: Build Linux executable
        run: cargo build --locked --release -p cpm-app
      - name: Smoke test desktop startup with software OpenGL
        run: |
          set +e
          timeout 12s xvfb-run -a target/release/cpm > startup.log 2>&1
          code=$?
          set -e
          cat startup.log
          test "$code" -eq 124
          test -s target/release/properties/dynamx.json
          test -s target/release/properties/basics-addon.json
      - name: Package portable Linux application
        run: |
          mkdir -p release package/CPM
          cp target/release/cpm release/cpm-linux-x86_64
          cp target/release/cpm package/CPM/cpm
          cargo run --locked --release -p cpm-core --example export_catalogs -- package/CPM/properties
          cp docs/linux.md package/CPM/LIRE-MOI.md
          cp crates/cpm-app/assets/cpm.png package/CPM/cpm.png
          chmod +x package/CPM/cpm release/cpm-linux-x86_64
          tar -czf release/cpm-linux-x86_64.tar.gz -C package CPM
          tar -tzf release/cpm-linux-x86_64.tar.gz
          ldd target/release/cpm
      - uses: actions/upload-artifact@v7
        with:
          name: cpm-linux-x86_64
          path: release/*
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/rust-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cpm-*-x86_64
          path: release
          merge-multiple: true
      - name: Verify both platforms and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          tag="rust-v$version"
          test -s release/cpm-windows-x86_64.exe
          test -s release/cpm-setup-windows-x86_64.exe
          test -s release/cpm-linux-x86_64
          test -s release/cpm-linux-x86_64.tar.gz
          (cd release && sha256sum cpm-* > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A published version is immutable; retries can finish only its draft.
            test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CPM v$version — Windows et Linux" --notes-file "docs/release-notes-v$version.md" --draft
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
