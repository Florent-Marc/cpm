[package]
name = "cpm-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
zip = { version = "9.6", default-features = false, features = ["deflate"] }
unrar = "0.5.8"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
tobj = { version = "4", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
base64 = "0.22"
