[package]
name = "cpm-app"
rust-version = "1.95"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cpm-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
rfd = "0.18"
ureq = { version = "3.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "cpm"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"
