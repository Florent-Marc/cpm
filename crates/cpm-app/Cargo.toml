[package]
name = "cpm-app"
rust-version = "1.95"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cpm-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard"] }
rfd = "0.18"

[[bin]]
name = "cpm"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1.34"
